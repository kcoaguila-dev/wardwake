<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#070a12" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Wardwake — Tactical Roguelike</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #070a12;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      }

      #app {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.9), 0 0 0 1px #1e293b;
        border-radius: 4px;
        max-width: 100vw;
        max-height: 100vh;
      }

      /* Portrait Orientation Helper Banner on Mobile */
      #orientation-hint {
        display: none;
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid #38bdf8;
        border-radius: 20px;
        padding: 8px 16px;
        color: #f1f5f9;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        z-index: 9999;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        animation: pulseFade 2.5s infinite ease-in-out;
      }

      #orientation-hint span.dismiss {
        cursor: pointer;
        opacity: 0.7;
        margin-left: 6px;
        font-weight: bold;
      }

      @media screen and (orientation: portrait) and (max-width: 768px) {
        #orientation-hint {
          display: flex;
        }
      }

      @keyframes pulseFade {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.75; }
      }
    </style>
  </head>
  <body>
    <div id="orientation-hint">
      <span>📱 Rotate to Landscape for Full Widescreen</span>
      <span class="dismiss" onclick="document.getElementById('orientation-hint').style.display='none'">✕</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
